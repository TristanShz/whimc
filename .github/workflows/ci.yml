name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web exec tsc --noEmit -p .
      - run: pnpm -C web exec vitest run
      - run: pnpm -C web exec prettier --check .
      - run: pnpm -C web build

  go:
    name: Go (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # cgo (tree-sitter): test on both operating systems whimc ships for.
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The web UI is embedded with go:embed: build it before Go.
      - run: make web
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/whimc
      - run: ./whimc version
